# Fork-only: NetBSD investigation
name: ci-extra-netbsd
on:
  workflow_dispatch:
  push:
    branches: [ 'ci-extra-netbsd' ]
permissions:
  contents: read
jobs:
  netbsd:
    name: netbsd ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [v3.6.1, v3.6.1-pax-off, v3.5.4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare source
        run: |
          git remote add up https://github.com/microsoft/mimalloc.git && git fetch -q up dev2 --tags
          case "${{ matrix.variant }}" in
            dev3-patched) patch -p1 < ci-extra/netbsd.patch ;;
            v3.7.0|v3.0.10|v3.6.1|v3.5.4) git checkout -q ${{ matrix.variant }} -- src include CMakeLists.txt cmake test ;;
            v3.6.1-pax-off) git checkout -q v3.6.1 -- src include CMakeLists.txt cmake test ;;
            dev2) git checkout -q up/dev2 -- src include CMakeLists.txt cmake test ;;
          esac
          git diff --stat | tail -1
      - uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: netbsd
          version: '10.1'
          shell: bash
          run: |
            sudo pkgin -y install cmake >/dev/null
            sysctl security.pax.mprotect.enabled security.pax.mprotect.global || true
            if [ "${{ matrix.variant }}" = dev3-pax-off ] || [ "${{ matrix.variant }}" = v3.6.1-pax-off ]; then sudo sysctl -w security.pax.mprotect.global=0; fi
            cmake -B out/dbg -DCMAKE_BUILD_TYPE=Debug -DMI_DEBUG=FULL > /dev/null && cmake --build out/dbg --parallel 2 > build.log 2>&1 || { tail -30 build.log; echo "BUILD FAILED"; }
            echo "=== gdb backtrace (debug test-api)"
            gdb -q -batch -ex run -ex bt -ex 'info threads' out/dbg/mimalloc-test-api 2>&1 | grep -vE '^\[|^warning' | head -80 || true
            echo "=== end gdb"
            MI_TEST_LIGHT=1 ctest --test-dir out/dbg --output-on-failure --timeout 900 2>&1 | tee ctest.log | tail -40
            grep -E "assertion|cannot commit|tests passed" ctest.log | sort | uniq -c | head
            cmake -B out/rel -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build out/rel --parallel 2 > build2.log 2>&1 || { tail -30 build2.log; echo "BUILD FAILED"; }
            ctest --test-dir out/rel --output-on-failure --timeout 900 2>&1 | grep -E "tests passed|Failed|SegFault" | head -20
